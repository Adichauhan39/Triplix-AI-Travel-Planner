<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Triplix is India's AI-powered travel planning app. Find and book flights, hotels, trains, and buses across India with a personalized itinerary built around your budget, dates, and preferences, powered by Google Gemini.">
  <meta name="keywords" content="India travel planner, AI travel assistant India, flight booking India, hotel booking India, train booking India, bus booking India, trip itinerary India, domestic travel India">

  <!-- Open Graph / social link previews -->
  <meta property="og:title" content="Triplix - India's AI Travel Assistant">
  <meta property="og:description" content="Plan and book flights, hotels, trains, and buses across India with an AI-powered travel assistant that builds your itinerary around your budget and preferences.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_IN">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_travel_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Triplix - India's AI Travel Assistant | Flights, Hotels, Trains & Bus Booking</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google reCAPTCHA v2 (checkbox) API -->
  <script src="https://www.google.com/recaptcha/api.js?render=explicit" async defer></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      z-index: 9999;
    }
    
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    
    .triplix-logo {
      width: 150px;
      height: 150px;
      animation: fadeInScale 1s ease-out;
    }
    
    .powered-by {
      color: white;
      font-size: 14px;
      font-family: Arial, sans-serif;
      opacity: 0.8;
      margin-top: 10px;
    }
    

    
    .loading-spinner {
      margin-top: 30px;
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <!-- Flutter web renders entirely client-side via JS, so crawlers/bots
       that don't execute JS (search engines doing a quick pass, some
       affiliate-network review bots) see nothing without this fallback. -->
  <noscript>
    <h1>Triplix - India's AI Travel Assistant</h1>
    <p>
      Triplix is an AI-powered travel planning app for travel across India.
      Tell Triplix your budget, travel dates, and preferences, and it builds
      a personalized trip itinerary for you, powered by Google Gemini.
    </p>
    <p>
      Search and compare flights, hotels, trains, and bus routes between
      Indian cities like Mumbai, Delhi, Goa, Bangalore, Jaipur, Kolkata,
      Chennai, and Hyderabad, shortlist your favorites, and book directly
      through our trusted travel partners.
    </p>
  </noscript>
  <div id="splash-screen">
    <div class="logo-container">
      <img src="favicon.png" alt="Triplix Logo" class="triplix-logo">
    </div>
    <div class="loading-spinner"></div>
  </div>
  
  <script>
    // Force clear all service workers and caches to fix white screen
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var r of registrations) {
          r.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) {
          caches.delete(name);
        }
      });
    }
  </script>

  <script>
    // Remove splash screen once Flutter is loaded
    window.addEventListener('load', function() {
      // Hide splash immediately if taking too long
      setTimeout(function() {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.style.display = 'none';
        }
      }, 3000);
    });
    
    // Also hide on Flutter ready
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash-screen');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.transition = 'opacity 0.3s ease-out';
        setTimeout(function() {
          splash.style.display = 'none';
        }, 300);
      }
    });
  </script>
  
  <!-- Google Maps JavaScript API (with Places library for city autocomplete).
       The key is supplied by env.js (gitignored, generated from
       GOOGLE_MAPS_API_KEY in .env - see web/env.js.example) so it's never
       committed to this file. -->
  <script src="env.js"></script>
  <script>
    (function () {
      var key = (window.GOOGLE_MAPS_API_KEY || '');
      var script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&libraries=places';
      document.head.appendChild(script);
    })();
  </script>

  <!-- Firebase JS SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
