name: flutter_travel_app
description: AI Travel Booking App - Similar to EaseMyTrip with Multi-Agent Backend
publish_to: 'none'
version: 1.0.0+1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/triplix_sticker.png"

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.9.0
  firebase_auth: ^5.5.0
  # Stores a trip under its id so it can be opened, and edited, by more
  # than one person. Realtime listeners come with it, which is what makes
  # two travellers editing the same day workable without a sync protocol
  # of our own.
  cloud_firestore: ^5.6.0
  
  # UI Components
  cupertino_icons: ^1.0.2
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # State Management
  provider: ^6.1.1
  get: ^4.6.6
  
  # Networking
  http: ^1.5.0
  dio: ^5.4.0
  
  # Google AI
  google_generative_ai: ^0.4.6
  
  # Voice Input
  speech_to_text: ^6.6.0
  permission_handler: ^11.3.0
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Swipe Cards
  flutter_card_swiper: ^7.0.0
  
  # Maps
  google_maps_flutter: ^2.5.0
  google_maps_flutter_web: ^0.5.4+2
  geolocator: ^10.1.0
  
  # Google Services
  googleapis: ^11.4.0
  google_sign_in: ^6.1.5
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  
  # Date/Time
  intl: ^0.19.0
  table_calendar: ^3.0.9
  
  # Icons & Animations
  font_awesome_flutter: ^11.0.0
  lottie: ^3.0.0
  animate_do: ^3.1.2
  
  # Image Picker
  image_picker: ^1.0.5
  
  # URL Launcher
  url_launcher: ^6.2.2
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Charts
  fl_chart: ^0.66.0
  
  # Share
  share_plus: ^7.2.1
  flutter_easy_recaptcha_v2: ^0.1.0

  # Environment variables (.env)
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/logo/

  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
