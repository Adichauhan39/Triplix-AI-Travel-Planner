# Cloud Build config for deploying Triplix backend to Cloud Run
# Usage: gcloud builds submit --config cloudbuild.yaml 7-multi-agent/

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/triplix-server:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/triplix-server:latest'
      - '7-multi-agent/'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/triplix-server:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/triplix-server:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'triplix-server'
      - '--image'
      - 'gcr.io/$PROJECT_ID/triplix-server:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--update-env-vars'
      - 'MONGODB_DB=triplix'

images:
  - 'gcr.io/$PROJECT_ID/triplix-server:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/triplix-server:latest'
